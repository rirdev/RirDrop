<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="#272738" stroke-width="4"/>

  <!-- Glowing Emblem Elements -->
  <g transform="translate(136, 136)" filter="url(#glow)">
    <!-- Top-Left Lime Bubble -->
    <rect x="0" y="0" width="105" height="105" rx="35" fill="url(#limeGrad)"/>
    <!-- Top-Right Cyan Bubble -->
    <rect x="135" y="0" width="105" height="105" rx="35" fill="url(#cyanGrad)"/>
    <!-- Bottom-Left Yellow Bubble -->
    <rect x="0" y="135" width="105" height="105" rx="35" fill="url(#yellowGrad)"/>
    <!-- Bottom-Right Purple Bubble -->
    <rect x="135" y="135" width="105" height="105" rx="35" fill="url(#purpleGrad)"/>

    <!-- Central Drop / Network Radio Ring -->
    <circle cx="120" cy="120" r="28" fill="#ffffff" opacity="0.95"/>
    <path d="M 108 120 L 132 120 M 120 108 L 120 132" stroke="#0c0c10" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
